<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丛林酷跑 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2f38;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { display: block; }

  /* 道具状态栏 */
  #powerup-bar { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 10px; z-index: 5; }
  #powerup-bar .pu { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 999px; color: #fff; font-size: 14px; font-weight: 600;
    background: rgba(20, 36, 44, .85); border: 1px solid rgba(255,255,255,.18);
    text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #powerup-bar .pu.weak { opacity: .45; }
  button.btn-secondary { margin-top: 12px; padding: 13px 52px; font-size: 18px; font-weight: 700;
    color: #12242c; background: linear-gradient(180deg, #9fd4e8, #5a9db8); border: none;
    border-radius: 999px; cursor: pointer; }

  /* HUD */
  #hud { position: fixed; top: 16px; left: 0; right: 0; display: flex; justify-content: center;
    gap: 28px; color: #fff; font-size: 20px; font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,.5); pointer-events: none; z-index: 5; }
  #hud .item { display: flex; align-items: center; gap: 6px; }
  #hud .coin-icon { width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe97a, #e8a20c); display: inline-block; }

  /* 面板 */
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 20, 26, .55); backdrop-filter: blur(4px); z-index: 10; }
  .panel.hidden { display: none; }
  .panel .card { background: rgba(20, 36, 44, .92); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 40px 56px; text-align: center; color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .panel h1 { font-size: 40px; letter-spacing: 4px; margin-bottom: 10px;
    background: linear-gradient(180deg, #ffe27a, #ff9d3c); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent; }
  .panel h2 { font-size: 32px; margin-bottom: 8px; }
  .panel p { color: #a8c3cc; font-size: 15px; line-height: 1.9; }
  .panel .score-line { font-size: 20px; color: #ffe27a; margin: 14px 0 4px; }
  .panel .best { font-size: 14px; color: #7fa5b0; }
  .panel button { margin-top: 26px; padding: 13px 52px; font-size: 18px; font-weight: 700;
    color: #24313a; background: linear-gradient(180deg, #ffd76a, #ff9d3c); border: none;
    border-radius: 999px; cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .panel button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,157,60,.4); }
  .keys { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .keys span { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; color: #cfe4ea; }
  .credit { margin-top: 22px; font-size: 12px; color: #6f8f9a; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<div id="hud">
  <div class="item">分数 <span id="hud-score">0</span></div>
  <div class="item"><span class="coin-icon"></span> <span id="hud-coins">0</span></div>
  <div class="item">速度 <span id="hud-speed">0</span></div>
</div>

<div id="start-panel" class="panel">
  <div class="card">
    <h1>丛林酷跑</h1>
    <p>躲避障碍，收集金币，跑得越远越好！</p>
    <div class="keys">
      <span>← → 左右移动</span><span>↑ / 空格 跳跃</span><span>↓ 滑铲</span><span>手机滑动同理</span>
    </div>
    <button type="button" id="btn-start">开始游戏</button>
    <p class="credit">Powered by Three.js · AI 辅助开发：GLM-5.3</p>
  </div>
</div>

<div id="over-panel" class="panel hidden">
  <div class="card">
    <h2>游戏结束</h2>
    <div class="score-line">得分 <span id="over-score">0</span></div>
    <div class="score-line">金币 <span id="over-coins">0</span></div>
    <div class="best">最高分：<span id="over-best">0</span></div>
    <button type="button" id="btn-restart">再来一局</button>
  </div>
</div>

<div id="pause-panel" class="panel hidden">
  <div class="card">
    <h2>已暂停</h2>
    <p>按 Esc / P 或点击按钮继续</p>
    <button type="button" id="btn-resume">继续游戏</button>
    <div></div>
    <button type="button" id="btn-pause-restart" class="btn-secondary">重新开始</button>
  </div>
</div>

<!-- 道具状态栏 -->
<div id="powerup-bar"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
